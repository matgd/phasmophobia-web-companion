<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phasmophobia — Dziennik Śledczego / Investigator's Journal</title>
  <!-- Czcionki maszynowe oraz odręczne do akcentów w dzienniku -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-desk: #161412;
      --cover-leather: #28211b;
      --cover-border: #17120e;
      --paper-light: #efe5cf;
      --paper-mid: #e4d5b7;
      --paper-dark: #cbb894;
      --paper-edge: #9e8a66;
      --ink-main: #221d18;
      --ink-faded: rgba(34, 29, 24, 0.26);
      --ink-muted: #5c5144;
      --ink-red: #8c231c;
      --ink-blue: #233b6e;
      --ink-green: #225432;
      --tab-bg: #d9c6a1;
      --tab-active: #efe5cf;
      --shadow-book: 0 26px 65px rgba(0, 0, 0, 0.85), 0 8px 20px rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-desk);
      background-image:
        radial-gradient(circle at 50% 35%, rgba(62, 52, 42, 0.45) 0%, rgba(15, 13, 11, 0.96) 80%),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 14px);
      font-family: 'Courier Prime', monospace;
      color: var(--ink-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 12px 32px;
      overflow-x: hidden;
    }

    /* Górny pasek narzędzi (Przełącznik PL/EN, Reset, Licznik duchów) */
    .top-utility-bar {
      width: 100%;
      max-width: 1320px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding: 0 6px;
      z-index: 20;
    }

    .brand-tag {
      font-family: 'Special Elite', cursive;
      color: #cbbba0;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .utility-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-vintage {
      font-family: 'Special Elite', cursive;
      font-size: 0.88rem;
      padding: 7px 14px;
      border-radius: 4px;
      border: 1px solid #6e5d47;
      background: linear-gradient(180deg, #3b3127 0%, #261f18 100%);
      color: #efe5cf;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.12);
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .btn-vintage:hover {
      border-color: #b89e78;
      background: linear-gradient(180deg, #4a3d31 0%, #2e251d 100%);
      transform: translateY(-1px);
    }

    .btn-vintage:active {
      transform: translateY(1px);
    }

    .btn-vintage.danger {
      border-color: #7c2e28;
      color: #f7d5d2;
    }

    .btn-vintage.danger:hover {
      border-color: #c24b42;
      background: linear-gradient(180deg, #59221e 0%, #381411 100%);
    }

    .lang-switch {
      display: inline-flex;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #6e5d47;
      box-shadow: 0 3px 8px rgba(0,0,0,0.55);
    }

    .lang-btn {
      font-family: 'Special Elite', cursive;
      font-size: 0.86rem;
      padding: 7px 12px;
      border: none;
      background: #241d17;
      color: #9e8d77;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .lang-btn.active {
      background: #efe5cf;
      color: #221d18;
      font-weight: bold;
    }

    /* Okładka i rozłożony dziennik */
    .journal-cover {
      position: relative;
      width: 100%;
      max-width: 1320px;
      background: linear-gradient(135deg, #2d241d 0%, #1d1712 50%, #261e17 100%);
      border: 3px solid var(--cover-border);
      border-radius: 12px;
      padding: 14px 16px 16px;
      box-shadow: var(--shadow-book);
    }

    /* Szwy na skórzanej okładce */
    .journal-cover::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px dashed rgba(212, 185, 142, 0.22);
      border-radius: 8px;
      pointer-events: none;
    }

    /* Wystające zakładki indeksujące na górze stron */
    .journal-tabs-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 18px;
      margin-bottom: -2px;
      position: relative;
      z-index: 15;
      gap: 12px;
      flex-wrap: wrap;
    }

    .page-tabs-group {
      display: flex;
      gap: 6px;
    }

    .paper-tab {
      font-family: 'Special Elite', cursive;
      font-size: 0.92rem;
      padding: 8px 16px 7px;
      background: linear-gradient(180deg, #cbb68e 0%, #b59e74 100%);
      color: #3a3026;
      border: 1px solid #8a7552;
      border-bottom: none;
      border-radius: 7px 7px 0 0;
      cursor: pointer;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.35);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      position: relative;
      top: 2px;
    }

    .paper-tab:hover {
      background: linear-gradient(180deg, #dfd0b0 0%, #cbb68e 100%);
      color: #1f1a15;
    }

    .paper-tab.active {
      background: linear-gradient(180deg, #f3ead6 0%, #efe5cf 100%);
      color: #1a1510;
      top: 0;
      padding-bottom: 9px;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.4);
      z-index: 4;
    }

    /* Rozłożone dwie kartki */
    .spread-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 690px;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 6px 20px rgba(0,0,0,0.65);
    }

    /* Grzbiet książki pośrodku */
    .book-spine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 44px;
      transform: translateX(-50%);
      background: linear-gradient(
        90deg,
        rgba(35, 26, 17, 0) 0%,
        rgba(35, 26, 17, 0.16) 28%,
        rgba(20, 14, 9, 0.48) 50%,
        rgba(35, 26, 17, 0.16) 72%,
        rgba(35, 26, 17, 0) 100%
      );
      pointer-events: none;
      z-index: 10;
    }

    /* Wspólny styl pojedynczej strony papieru */
    .journal-page {
      position: relative;
      background-color: var(--paper-light);
      padding: 26px 34px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-y: auto;
      max-height: 82vh;
    }

    .journal-page.left-page {
      background-image:
        radial-gradient(ellipse at 18% 12%, rgba(163, 134, 88, 0.16) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 88%, rgba(138, 110, 68, 0.18) 0%, transparent 48%),
        linear-gradient(90deg, #d7c49e 0%, #efe5cf 5%, #efe5cf 93%, #d8c6a2 100%);
      border-right: 1px solid rgba(82, 65, 44, 0.35);
    }

    .journal-page.right-page {
      background-image:
        radial-gradient(ellipse at 82% 16%, rgba(163, 134, 88, 0.15) 0%, transparent 45%),
        radial-gradient(ellipse at 22% 84%, rgba(138, 110, 68, 0.16) 0%, transparent 48%),
        linear-gradient(90deg, #d6c39e 0%, #efe5cf 7%, #efe5cf 95%, #d5c19b 100%);
    }

    /* Dekoracyjna plama po kawie / atramencie */
    .ink-stain {
      position: absolute;
      pointer-events: none;
      opacity: 0.08;
      z-index: 1;
    }

    /* Pasek przewijania stylizowany na papier */
    .journal-page::-webkit-scrollbar {
      width: 7px;
    }
    .journal-page::-webkit-scrollbar-track {
      background: rgba(168, 148, 112, 0.25);
    }
    .journal-page::-webkit-scrollbar-thumb {
      background: rgba(112, 93, 64, 0.55);
      border-radius: 4px;
    }

    /* Nagłówki sekcji w dzienniku */
    .page-header {
      border-bottom: 2px solid var(--ink-main);
      padding-bottom: 8px;
      margin-bottom: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .page-title {
      font-family: 'Special Elite', cursive;
      font-size: 1.95rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      color: var(--ink-main);
      line-height: 1.05;
    }

    .page-subtitle-action {
      font-family: 'Special Elite', cursive;
      font-size: 0.82rem;
      background: rgba(140, 35, 28, 0.08);
      border: 1px dashed rgba(140, 35, 28, 0.55);
      color: var(--ink-red);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .page-subtitle-action:hover {
      background: rgba(140, 35, 28, 0.18);
    }

    /* Numer strony na dole jak w Phasmophobia (23 / 24) */
    .page-footer-number {
      margin-top: 20px;
      text-align: center;
      font-family: 'Special Elite', cursive;
      font-size: 1.05rem;
      color: var(--ink-muted);
      letter-spacing: 0.1em;
      user-select: none;
    }

    /* ================= LEWA STRONA: DOWODY ================= */
    .evidence-legend {
      font-size: 0.8rem;
      color: var(--ink-muted);
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background: rgba(186, 166, 130, 0.24);
      padding: 6px 10px;
      border-radius: 4px;
      border-left: 3px solid var(--ink-muted);
    }

    .evidence-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 2;
    }

    .evidence-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background 0.14s ease, transform 0.1s ease;
      border: 1px solid transparent;
    }

    .evidence-row:hover {
      background: rgba(173, 150, 110, 0.25);
      border-color: rgba(112, 92, 62, 0.25);
    }

    .evidence-row:active {
      transform: scale(0.995);
    }

    .evidence-checkbox-svg {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
    }

    .evidence-icon-wrap {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-main);
      flex-shrink: 0;
      transition: opacity 0.2s ease;
    }

    .evidence-label-text {
      font-family: 'Special Elite', cursive;
      font-size: 1.45rem;
      color: var(--ink-main);
      position: relative;
      transition: color 0.2s ease, opacity 0.2s ease;
      line-height: 1.2;
    }

    /* Stan potwierdzony [X] */
    .evidence-row.state-confirmed {
      background: rgba(35, 59, 110, 0.08);
      border-color: rgba(35, 59, 110, 0.25);
    }
    .evidence-row.state-confirmed .evidence-label-text {
      color: #16284c;
    }

    /* Stan wykluczony [—] z wyraźnym odręcznym przekreśleniem */
    .evidence-row.state-ruled_out .evidence-label-text,
    .evidence-row.state-ruled_out .evidence-icon-wrap {
      opacity: 0.44;
    }

    .evidence-row.state-ruled_out .evidence-label-text::after {
      content: "";
      position: absolute;
      left: -4px;
      right: -6px;
      top: 50%;
      height: 3px;
      background: var(--ink-red);
      transform: rotate(-1.2deg);
      border-radius: 2px;
      box-shadow: 0 1px 1px rgba(0,0,0,0.2);
    }

    /* Podsumowanie znalezionych dowodów na dole lewej strony */
    .evidence-summary-box {
      margin-top: 22px;
      padding: 12px 14px;
      border: 1px dashed rgba(74, 61, 45, 0.5);
      border-radius: 5px;
      background: rgba(214, 196, 162, 0.25);
      font-size: 0.88rem;
      color: var(--ink-muted);
    }

    /* ================= LEWA STRONA: PRZEKLĘTE PRZEDMIOTY ================= */
    .cursed-selector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 8px;
      margin-bottom: 16px;
    }

    .cursed-item-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 6px;
      background: rgba(204, 184, 146, 0.32);
      border: 1px solid rgba(99, 82, 58, 0.45);
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Special Elite', cursive;
      font-size: 0.82rem;
      color: var(--ink-main);
      text-align: center;
      transition: all 0.15s ease;
    }

    .cursed-item-btn:hover {
      background: rgba(204, 184, 146, 0.6);
      transform: translateY(-1px);
    }

    .cursed-item-btn.active {
      background: #2b231b;
      color: #f2e8d2;
      border-color: #17120e;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    }

    .cursed-detail-card {
      background: rgba(255, 250, 240, 0.45);
      border: 1px solid rgba(97, 80, 56, 0.4);
      border-radius: 6px;
      padding: 14px 16px;
      font-size: 0.9rem;
      line-height: 1.48;
    }

    .cursed-detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(60, 49, 36, 0.35);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .cursed-detail-title {
      font-family: 'Special Elite', cursive;
      font-size: 1.4rem;
      color: var(--ink-main);
    }

    .cursed-summary {
      font-style: italic;
      color: #3f352a;
      margin-bottom: 12px;
    }

    .cursed-section-heading {
      font-family: 'Special Elite', cursive;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 12px 0 6px;
      color: var(--ink-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .cursed-list {
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .cursed-hunt-box {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(140, 35, 28, 0.09);
      border: 1.5px solid rgba(140, 35, 28, 0.55);
      border-radius: 5px;
    }

    .cursed-hunt-title {
      font-family: 'Special Elite', cursive;
      color: var(--ink-red);
      font-size: 0.96rem;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .wish-cat-box {
      margin-top: 10px;
      border-left: 3px solid #4a3c2c;
      padding-left: 10px;
    }

    .wish-cat-title {
      font-family: 'Special Elite', cursive;
      font-weight: bold;
      color: var(--ink-blue);
      margin-bottom: 4px;
    }

    .wish-item {
      margin-bottom: 7px;
      font-size: 0.86rem;
    }

    .wish-phrase {
      font-weight: 700;
      color: #1d1712;
    }

    .tarot-table, .ouija-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.82rem;
    }

    .tarot-table th, .tarot-table td,
    .ouija-table th, .ouija-table td {
      border: 1px solid rgba(87, 71, 50, 0.35);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }

    .tarot-table th, .ouija-table th {
      background: rgba(173, 150, 110, 0.32);
      font-family: 'Special Elite', cursive;
    }

    /* ================= PRAWA STRONA: LISTA DUCHÓW (3 KOLUMNY) ================= */
    .right-intro-text {
      text-align: center;
      font-family: 'Special Elite', cursive;
      font-size: 1.05rem;
      line-height: 1.4;
      color: #2c241d;
      margin-bottom: 18px;
      padding: 0 8px;
    }

    .ghost-grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 8px;
      align-items: center;
      justify-items: center;
      position: relative;
      z-index: 2;
    }

    .ghost-cell {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7px 4px;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .ghost-cell:hover {
      background: rgba(168, 145, 105, 0.24);
    }

    .ghost-name-text {
      font-family: 'Special Elite', cursive;
      font-size: 1.24rem;
      color: var(--ink-main);
      text-align: center;
      position: relative;
      z-index: 2;
      transition: color 0.2s ease, opacity 0.2s ease;
      line-height: 1.15;
    }

    .ghost-en-hint {
      font-family: 'Courier Prime', monospace;
      font-size: 0.68rem;
      color: var(--ink-muted);
      opacity: 0.78;
      margin-top: 1px;
    }

    /* Automatycznie wyszarzony duch (nie pasuje do dowodów) */
    .ghost-cell.auto-ruled-out .ghost-name-text,
    .ghost-cell.auto-ruled-out .ghost-en-hint {
      color: var(--ink-faded);
      opacity: 0.42;
    }

    /* Ręcznie skreślony przez gracza */
    .ghost-cell.manual-crossed .ghost-name-text {
      color: rgba(45, 37, 29, 0.45);
    }

    .ghost-cell.manual-crossed .ghost-name-text::after {
      content: "";
      position: absolute;
      left: -6px;
      right: -6px;
      top: 50%;
      height: 2.5px;
      background: var(--ink-red);
      transform: rotate(-3deg);
      border-radius: 2px;
    }

    /* Odręczne zakreślenie kółkiem (jak na zrzucie ekranu z Phasmophobia!) */
    .hand-circle-svg {
      position: absolute;
      inset: -3px 4px;
      width: calc(100% - 8px);
      height: calc(100% + 6px);
      pointer-events: none;
      z-index: 3;
    }

    .ghost-legend-bar {
      margin-top: 16px;
      padding-top: 8px;
      border-top: 1px dashed rgba(82, 65, 44, 0.35);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--ink-muted);
    }

    /* ================= PRAWA STRONA: WIDOK SZCZEGÓŁÓW ================= */
    .details-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.85rem;
      color: var(--ink-muted);
      background: rgba(186, 166, 130, 0.25);
      padding: 6px 10px;
      border-radius: 4px;
    }

    .details-cards-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .ghost-detail-card {
      background: rgba(255, 251, 242, 0.55);
      border: 1.5px solid rgba(72, 58, 41, 0.45);
      border-radius: 6px;
      padding: 14px 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      position: relative;
    }

    .ghost-detail-card.is-circled {
      border: 2px solid var(--ink-blue);
      background: rgba(235, 242, 255, 0.55);
    }

    .gdc-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      border-bottom: 1px solid rgba(72, 58, 41, 0.3);
      padding-bottom: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .gdc-name {
      font-family: 'Special Elite', cursive;
      font-size: 1.45rem;
      color: var(--ink-main);
    }

    .gdc-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ghost-signature-badge {
      width: 38px;
      height: 38px;
      border-radius: 7px;
      background: rgba(186, 166, 130, 0.32);
      border: 1.5px solid rgba(72, 58, 41, 0.5);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-main);
      flex-shrink: 0;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.45);
    }

    .gdc-name-sub {
      font-family: 'Courier Prime', monospace;
      font-size: 0.85rem;
      color: var(--ink-muted);
      margin-left: 6px;
    }

    .gdc-evidences {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ev-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(186, 166, 130, 0.35);
      border: 1px solid rgba(82, 65, 44, 0.4);
      color: #241d17;
      position: relative;
    }

      gap: 8px;
      margin-bottom: 11px;

      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      padding: 7px 9px;
      background: rgba(214, 198, 168, 0.34);
      border-radius: 5px;
      border: 1px solid rgba(99, 82, 58, 0.28);
      font-size: 0.8rem;
      line-height: 1.28;

      display: flex;
      align-items: center;
      gap: 6px;
    }

      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--ink-muted);
      letter-spacing: 0.03em;

    .tele-value {
      font-weight: 700;
      font-size: 0.84rem;
      color: #1d1712;

      height: 7px;
      background: rgba(74, 61, 45, 0.18);
      border-radius: 4px;
      margin-top: 3px;
      overflow: visible;
    }

    .speed-gauge-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      border-radius: 4px;
    }

    .speed-gauge-std-tick {
      position: absolute;
      top: -2px;
      bottom: -2px;
      left: 50%;
      width: 2px;
      background: #221d18;
      z-index: 2;
    }

    .sanity-bar-track {
      position: relative;
      height: 6px;
      background: rgba(74, 61, 45, 0.18);
      border-radius: 4px;
      margin-top: 3px;
      overflow: hidden;

      height: 100%;
      border-radius: 4px;

      line-height: 1.36;

      font-weight: 700;

      display: inline-block;
      width: 10px;
      height: 10px;

      margin-right: 4px;
      vertical-align: middle;
    }

    .ghost-tooltip {
      position: fixed;
      z-index: 9999;
      width: 355px;
      max-width: calc(100vw - 24px);
      background: #f5edd9;
      background-image: linear-gradient(180deg, #f8f2e3 0%, #eadbc0 100%);
      border: 2px solid #3c3024;
      border-radius: 6px;
      padding: 11px 13px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.72), 0 3px 8px rgba(0,0,0,0.4);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
      font-size: 0.8rem;
      line-height: 1.35;
      color: #1f1914;
    }

    .ghost-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .tooltip-header {
      font-family: 'Special Elite', cursive;
      font-size: 1.15rem;
      border-bottom: 1.5px solid #3c3024;
      padding-bottom: 4px;
      margin-bottom: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .tooltip-title-left {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .tooltip-ev-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 7px;
    }

    .tooltip-mini-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      margin-bottom: 6px;
    }

    .tooltip-stat {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(214, 198, 168, 0.38);
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 0.76rem;
    }

    .tooltip-trait {
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px dashed rgba(60, 48, 36, 0.35);
      font-size: 0.77rem;
      color: #2b221a;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    @media (max-width: 960px) {

      }

    function getSortedGhosts() {
      return [...DATA.ghosts].sort((a, b) =>
        a.name.en.localeCompare(b.name.en, "en", { sensitivity: "base" })
      );
    }

    // Bezpieczne escapowanie HTML przed wstawieniem do szablonów
    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // =========================================================================
    // 3. STAN APLIKACJI I ZAPIS W LOCALSTORAGE (Z FALLBACKIEM W PAMIĘCI)
    // =========================================================================
    const STORAGE_KEY = "phasmophobia_companion_journal_v1";
    let memoryFallbackStorage = null;

    const defaultState = {
      lang: "pl",
      leftTab: "evidence",      // 'evidence' | 'cursed'
      rightTab: "list",         // 'list' | 'details'
      selectedCursedId: "music_box",
      compactDetails: true,     // true = zwięzłe punkty z ikonami, false = pełne opisy
      evidenceStates: {},       // klucz: nazwa angielska dowodu -> 'unknown' | 'confirmed' | 'ruled_out'
      ghostManualStates: {}     // klucz: id ducha -> 'normal' | 'circled' | 'crossed'
    };

    function cloneDefaultState() {
      return {
        lang: defaultState.lang,
        leftTab: defaultState.leftTab,
        rightTab: defaultState.rightTab,
        selectedCursedId: defaultState.selectedCursedId,
        compactDetails: defaultState.compactDetails,
        evidenceStates: {},
        ghostManualStates: {}
      };
    }

    let state = loadState();

    function loadState() {
      try {
        let raw = null;
        try {
          raw = window.localStorage.getItem(STORAGE_KEY);
        } catch (storageErr) {
          raw = memoryFallbackStorage;
        }
        if (!raw) return cloneDefaultState();
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return cloneDefaultState();

        const validEvStates = new Set(["unknown", "confirmed", "ruled_out"]);
        const validGhostStates = new Set(["normal", "circled", "crossed"]);

        const cleanEvidence = {};
        if (parsed.evidenceStates && typeof parsed.evidenceStates === "object") {
          for (const [k, v] of Object.entries(parsed.evidenceStates)) {
            if (validEvStates.has(v)) cleanEvidence[k] = v;
          }
        }

        const cleanGhosts = {};
        if (parsed.ghostManualStates && typeof parsed.ghostManualStates === "object") {
          for (const [k, v] of Object.entries(parsed.ghostManualStates)) {
            if (validGhostStates.has(v)) cleanGhosts[k] = v;
          }
        }

        return {
          lang: parsed.lang === "en" ? "en" : "pl",
          leftTab: parsed.leftTab === "cursed" ? "cursed" : "evidence",
          rightTab: parsed.rightTab === "details" ? "details" : "list",
          selectedCursedId: typeof parsed.selectedCursedId === "string" ? parsed.selectedCursedId : "music_box",
          compactDetails: typeof parsed.compactDetails === "boolean" ? parsed.compactDetails : true,
          evidenceStates: cleanEvidence,
          ghostManualStates: cleanGhosts
        };
      } catch (err) {
        return cloneDefaultState();
      }
    }

    function saveState() {
      try {
        const serialized = JSON.stringify(state);
        memoryFallbackStorage = serialized;
        try {
          window.localStorage.setItem(STORAGE_KEY, serialized);
        } catch (storageErr) {
          // W zablokowanym iframe/sandboxie używamy bezpiecznego fallbacku w pamięci
        }
      } catch (err) {
        // Ignorujemy błędy serializacji
      }
    }

    // Bezpieczne formatowanie tekstu bez ryzyka ingerencji w znaczniki HTML:
    // najpierw dzielimy tekst na dopasowania metryk, escapujemy zwykłe fragmenty i owijamy dopasowania w <span>.
    function formatRichText(text, isCompact = false) {
      let processed = String(text ?? "");
      if (isCompact && processed.length > 125) {
        processed = processed.replace(/\s*\([^)]{24,}\)/g, "");
      }

      const tokenRegex = /(\d+(?:[.,]\d+)?\s*(?:m\/s|%|s|min|m)\b|EMF\s*\d|Spirit\s*Box|D\.O\.T\.S\.|\bLOS\b|Tier\s*(?:I{1,3}|\d))/gi;
      let result = "";
      let lastIndex = 0;
      let match;

      while ((match = tokenRegex.exec(processed)) !== null) {
        if (match.index > lastIndex) {
          result += escapeHtml(processed.slice(lastIndex, match.index));
        }
        result += `<span class="hl-num">${escapeHtml(match[0])}</span>`;
        lastIndex = tokenRegex.lastIndex;
        if (match[0].length === 0) tokenRegex.lastIndex++;
      }

      if (lastIndex < processed.length) {
        result += escapeHtml(processed.slice(lastIndex));
      }

      return result;
    }

    // Generuje wizualny pasek prędkości względem standardu 1.7 m/s
    function renderSpeedGaugeHtml(speedObj) {
      if (speedObj.min_mps === null || speedObj.max_mps === null) {
        return `<div class="speed-gauge-track"><div class="speed-gauge-fill" style="left:15%; width:70%; background:repeating-linear-gradient(45deg,#6b4c8c,#6b4c8c 4px,#a084be 4px,#a084be 8px);"></div></div>`;
      }
      // Skala od 0.4 m/s (0%) do 3.0 m/s (100%), gdzie 1.7 m/s wypada dokładnie w 50%
      const toPct = (v) => Math.max(2, Math.min(98, ((v - 0.4) / (3.0 - 0.4)) * 100));
      const minP = toPct(speedObj.min_mps);
      const maxP = toPct(speedObj.max_mps);

      let color = "#4a3d2c"; // standard 1.7
      if (speedObj.max_mps < 1.7) color = "#233b6e"; // wolny
      else if (speedObj.min_mps > 1.7) color = "#8c231c"; // szybki
      else if (speedObj.min_mps !== speedObj.max_mps) color = "#7c3aed"; // zmienny

      const left = minP;
      const width = Math.max(8, maxP - minP);

      return `
        <div class="speed-gauge-track" title="1.7 m/s = środek / center">
          <div class="speed-gauge-std-tick"></div>
          <div class="speed-gauge-fill" style="left:${left}%; width:${width}%; background:${color};"></div>
        </div>
      `;
    }

    // Generuje wizualny pasek progu psychiki
    function renderSanityBarHtml(sanityObj) {
      const pct = sanityObj.base_percent;
      if (pct === null) {
        return `<div class="sanity-bar-track"><div class="sanity-bar-fill" style="width:65%; background:#6b4c8c;"></div></div>`;
      }
      let color = "#9e7416"; // 50%
      if (pct <= 40) color = "#225432"; // bezpieczniejszy (później poluje)
      else if (pct >= 60) color = "#8c231c"; // groźny (wcześnie poluje)

      return `
        <div class="sanity-bar-track">
          <div class="sanity-bar-fill" style="width:${pct}%; background:${color};"></div>
        </div>
      `;
    }

    // Helper do koloru płomienia Kart Tarota
    function getTarotFlameColorHex(enColor) {
      const c = enColor.toLowerCase();
      if (c.includes("red")) return "#c92a2a";
      if (c.includes("green")) return "#2b8a3e";
      if (c.includes("light blue")) return "#4dabf7";
      if (c.includes("blue")) return "#1864ab";
      if (c.includes("pink")) return "#e64980";
      if (c.includes("light purple")) return "#b197fc";
      if (c.includes("purple")) return "#6741d9";
      if (c.includes("light yellow")) return "#ffe066";
      if (c.includes("yellow")) return "#f59f00";
      if (c.includes("white")) return "#f8f9fa";
      return "#343a40";
    }

    function doesGhostMatchEvidence(ghost) {
      const confirmed = [];
      const ruledOut = [];

      for (const [evEn, st] of Object.entries(state.evidenceStates)) {
        if (st === "confirmed") confirmed.push(evEn);
        if (st === "ruled_out") ruledOut.push(evEn);
      }

      // Zestaw wszystkich dowodów, które dany duch może dać w śledztwie
      // Dla The Mimic są to 3 główne dowody + widmowe kule (Ghost Orb) jako wymuszona umiejętność!
      const ghostEvidenceSet = new Set(ghost.evidence.map(e => e.en));
      if (ghost.id === "the_mimic") {
        ghostEvidenceSet.add("Ghost Orb");
      }

      // 1. Duch musi posiadać WSZYSTKIE potwierdzone przez gracza dowody
      for (const reqEv of confirmed) {
        if (!ghostEvidenceSet.has(reqEv)) {
          return false;
        }
      }

      // 2. Duch NIE może posiadać ŻADNEGO wykluczonego dowodu
      // (W tym dla The Mimic: jeśli gracz wykluczy Ghost Orb, The Mimic zostaje wykluczony, bo Mimic zawsze ma Orby!)
      for (const excEv of ruledOut) {
        if (ghostEvidenceSet.has(excEv)) {
          return false;
        }
      }

      return true;
    }

    function isGhostGreyedOut(ghost) {
      const evidenceMatches = doesGhostMatchEvidence(ghost);
      const manual = state.ghostManualStates[ghost.id] || "normal";
      return !evidenceMatches || manual === "crossed";
    }

            <div class="ghost-legend-bar">
              <span>✎ ${escapeHtml(t.listHintClick)}</span>
              <span>👁 ${escapeHtml(t.listHintHover)}</span>
            </div>
          </div>
        `;
      } else {
        hideTooltip();

        if (activeGhosts.length === 0) {
          container.innerHTML = `
            <div>
              <div class="page-header">
                <h1 class="page-title">${escapeHtml(t.rightDetailsTitle)}</h1>
              </div>
              <div style="padding: 36px 20px; text-align: center; font-family: 'Special Elite', cursive; font-size: 1.15rem; color: var(--ink-red); border: 1.5px dashed rgba(140,35,28,0.45); border-radius: 6px; margin-top: 24px;">
                ${escapeHtml(t.noGhostsMatch)}
              </div>
            </div>
          `;
          return;
        }

        const cardsHtml = activeGhosts.map(ghost => {
          const manual = state.ghostManualStates[ghost.id] || "normal";
          const testObj = DATA.ghost_tests.find(gt => gt.ghost_id === ghost.id);
          const isCompact = state.compactDetails;

          const evBadges = ghost.evidence.map(ev => {
            const isConfirmed = state.evidenceStates[ev.en] === "confirmed";
            const isForced = ghost.forced_evidence && ghost.forced_evidence.en === ev.en;
            const cls = ["ev-badge"];
            if (isConfirmed) cls.push("confirmed-match");
            if (isForced) cls.push("forced-badge");

            return `
              <span class="${cls.join(" ")}">
                ${getEvidenceIconSvg(ev.en, 16)}
                <span>${escapeHtml(ev[lang])}</span>
                ${isForced ? `<small title="${escapeHtml(t.forcedEvidenceTag)}">🔒</small>` : ""}
              </span>
            `;
          }).join("");

          const mimicOrbBadge = ghost.id === "the_mimic" ? `
            <span class="ev-badge forced-badge ${state.evidenceStates['Ghost Orb'] === 'confirmed' ? 'confirmed-match' : ''}">
              ${getEvidenceIconSvg("Ghost Orb", 16)}
              <span>${escapeHtml(lang === "pl" ? "Widmowe kule" : "Ghost Orb")}</span>
              <small>[${escapeHtml(t.mimicOrbNote)}]</small>
            </span>
          ` : "";

          const losActive = ghost.line_of_sight_speed.can_speed_up !== false;

          return `
            <article class="ghost-detail-card ${manual === 'circled' ? 'is-circled' : ''}">
              <div class="gdc-top">
                <div>
                  <div class="gdc-title-group">
                    <span class="ghost-signature-badge" title="${escapeHtml(ghost.name[lang])}">
                      ${getGhostSignatureIconSvg(ghost.id, 24)}
                    </span>
                    <div>
                      <span class="gdc-name">${escapeHtml(ghost.name[lang])}</span>
                      ${ghost.name.pl !== ghost.name.en ? `<span class="gdc-name-sub">(${escapeHtml(lang === 'pl' ? ghost.name.en : ghost.name.pl)})</span>` : ""}
                    </div>
                  </div>
                  ${ghost.can_be_recognized_during_hunt ? `
                    <div class="hunt-id-pill">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                      </svg>
                      <span>${escapeHtml(t.huntIdBadge)}</span>
                    </div>` : ""}
                </div>
                <div class="gdc-evidences">
                  ${evBadges}
                  ${mimicOrbBadge}
                </div>
              </div>

              <div class="telemetry-strip">
                <div class="tele-box">
                  <div class="tele-head">
                    ${getStatIconSvg("base_speed")}
                    <div>
                      <div class="tele-label">${escapeHtml(t.statSpeed)}</div>
                      <div class="tele-value">${escapeHtml(ghost.speed.display[lang])}</div>
                    </div>
                  </div>
                  ${renderSpeedGaugeHtml(ghost.speed)}
                </div>

                <div class="tele-box">
                  <div class="tele-head">
                    ${getStatIconSvg("los_speed", losActive)}
                    <div>
                      <div class="tele-label">${escapeHtml(t.statLos)}</div>
                      <div class="tele-value" style="color:${losActive ? '#8c231c' : '#5c5144'};">
                        ${escapeHtml(ghost.line_of_sight_speed.label[lang])}
                      </div>
                    </div>
                  </div>
                </div>

                <div class="tele-box">
                  <div class="tele-head">
                    ${getStatIconSvg("sanity")}
                    <div>
                      <div class="tele-label">${escapeHtml(t.statSanity)}</div>
                      <div class="tele-value">${ghost.hunt_sanity.base_percent !== null ? escapeHtml(ghost.hunt_sanity.base_percent + '%') : '—'}</div>
                    </div>
                  </div>
                  ${renderSanityBarHtml(ghost.hunt_sanity)}
                  <div style="font-size:0.75rem; color:#3a3026;">${formatRichText(ghost.hunt_sanity.notes[lang], false)}</div>
                </div>
              </div>

              <div class="gdc-traits-list">
                ${ghost.special_traits.map(tr => `
                  <div class="trait-row">
                    <span class="trait-icon-badge">${getContextMechanicIcon(tr[lang], tr.category)}</span>
                    <span>${formatRichText(tr[lang], isCompact)}</span>
                  </div>
                `).join("")}
              </div>

              ${testObj ? `
                <div class="gdc-tests-box">
                  <div class="gdc-tests-title">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </svg>
                    <span>${escapeHtml(t.testsHeading)}</span>
                  </div>
                  <div>
                    ${testObj.steps.map(step => `
                      <div class="test-step-row">
                        <span style="flex-shrink:0; margin-top:2px;">${getContextMechanicIcon(step[lang], "evidence")}</span>
                        <span>${formatRichText(step[lang], isCompact)}</span>
                      </div>
                    `).join("")}
                  </div>
                </div>
              ` : ""}
            </article>
          `;
        }).join("");

        container.innerHTML = `
          <div>
            <div class="page-header">
              <h1 class="page-title">${escapeHtml(t.rightDetailsTitle)}</h1>
              <span style="font-family:'Special Elite',cursive; font-size:0.9rem; color:var(--ink-muted);">
                ${activeGhosts.length} / ${sortedGhosts.length}
              </span>
            </div>

            <div class="details-toolbar">
              <div class="icon-legend-strip">
                <span class="icon-legend-item">${getStatIconSvg("base_speed")} ${escapeHtml(t.legendSpeedIcon)}</span>
                <span class="icon-legend-item">${getStatIconSvg("los_speed", true)} ${escapeHtml(t.legendLosIcon)}</span>
                <span class="icon-legend-item">${getStatIconSvg("los_speed", false)} ${escapeHtml(t.legendNoLosIcon)}</span>
              </div>
              <button type="button" class="mode-toggle-mini" onclick="toggleCompactDetails()">
                ${escapeHtml(state.compactDetails ? t.fullModeBtn : t.compactModeBtn)}
              </button>
            </div>

            <div class="details-cards-list">
              ${cardsHtml}
            </div>
          </div>
        `;
      }
    }

    // =========================================================================
    // 9. DYMEK Z PODGLĄDEM DUCHA (HOVER TOOLTIP)
    // =========================================================================
    const tooltipEl = document.getElementById("ghostTooltip");
    let tooltipRafId = null;
    let latestPointer = { x: 0, y: 0 };

    function showGhostTooltip(event, ghostId) {
      if (state.rightTab !== "list") return;
      const ghost = DATA.ghosts.find(g => g.id === ghostId);
      if (!ghost) return;

      const lang = state.lang;

      const evHtml = ghost.evidence.map(ev => {
        const isForced = ghost.forced_evidence && ghost.forced_evidence.en === ev.en;
        return `
          <span class="ev-badge ${isForced ? 'forced-badge' : ''}" style="font-size:0.73rem; padding:2px 6px;">
            ${getEvidenceIconSvg(ev.en, 13)}
            <span>${escapeHtml(ev[lang])}</span>
            ${isForced ? '🔒' : ''}
          </span>
        `;
      }).join("") + (ghost.id === "the_mimic" ? `
        <span class="ev-badge forced-badge" style="font-size:0.73rem; padding:2px 6px;">
          ${getEvidenceIconSvg("Ghost Orb", 13)}
          <span>${escapeHtml(lang === "pl" ? "Widmowe kule" : "Ghost Orb")}</span>
        </span>` : "");

      const losActive = ghost.line_of_sight_speed.can_speed_up !== false;

      tooltipEl.innerHTML = `
        <div class="tooltip-header">
          <span class="tooltip-title-left">
            ${getGhostSignatureIconSvg(ghost.id, 20)}
            <span>${escapeHtml(ghost.name[lang])}</span>
          </span>
          ${ghost.name.pl !== ghost.name.en ? `<small style="font-family:'Courier Prime',monospace; font-size:0.76rem; color:#5c5144;">${escapeHtml(lang === 'pl' ? ghost.name.en : ghost.name.pl)}</small>` : ""}
        </div>
        <div class="tooltip-ev-row">${evHtml}</div>
        <div class="tooltip-mini-grid">
          <div class="tooltip-stat">
            ${getStatIconSvg("base_speed")}
            <span><strong>${escapeHtml(ghost.speed.display[lang])}</strong></span>
          </div>
          <div class="tooltip-stat">
            ${getStatIconSvg("los_speed", losActive)}
            <span><strong>${escapeHtml(ghost.line_of_sight_speed.label[lang])}</strong></span>
          </div>
        </div>
        <div class="tooltip-stat" style="margin-bottom:5px;">
          ${getStatIconSvg("sanity")}
          <span>${formatRichText(ghost.hunt_sanity.notes[lang], false)}</span>
        </div>
        <div class="tooltip-trait">
          <span style="flex-shrink:0;">${getContextMechanicIcon(ghost.special_traits[0][lang], ghost.special_traits[0].category)}</span>
          <span>${formatRichText(ghost.special_traits[0][lang], true)}</span>
        </div>
      `;

      tooltipEl.classList.add("visible");
      if (typeof event.clientX === "number" && typeof event.clientY === "number") {
        latestPointer = { x: event.clientX, y: event.clientY };
        positionTooltipAt(latestPointer.x, latestPointer.y);
      }
    }

    function positionTooltipAt(clientX, clientY) {
      if (!tooltipEl.classList.contains("visible")) return;
      const padding = 14;
      const rect = tooltipEl.getBoundingClientRect();

      let x = clientX + 16;
      let y = clientY + 16;

      if (x + rect.width > window.innerWidth - padding) {
        x = clientX - rect.width - 14;
      }
      if (x < padding) x = padding;

      if (y + rect.height > window.innerHeight - padding) {
        y = clientY - rect.height - 14;
      }
      if (y < padding) y = padding;

      tooltipEl.style.left = `${Math.round(x)}px`;
      tooltipEl.style.top = `${Math.round(y)}px`;
    }

    function moveGhostTooltip(event) {
      if (!tooltipEl.classList.contains("visible")) return;
      latestPointer = { x: event.clientX, y: event.clientY };
      if (tooltipRafId !== null) return;
      tooltipRafId = window.requestAnimationFrame(() => {
        tooltipRafId = null;
        positionTooltipAt(latestPointer.x, latestPointer.y);
      });
    }

    function hideTooltip() {
      if (tooltipRafId !== null) {
        window.cancelAnimationFrame(tooltipRafId);
        tooltipRafId = null;
      }
      tooltipEl.classList.remove("visible");
    }

    // Ukrywanie dymka przy przewijaniu stron lub zmianie rozmiaru okna
    window.addEventListener("scroll", hideTooltip, true);
    window.addEventListener("resize", hideTooltip);

    // =========================================================================
    // 10. AKTUALIZACJA CAŁEGO INTERFEJSU
    // =========================================================================
    function renderAll() {
      const t = UI_STRINGS[state.lang];

      // Aktualizacja etykiet na pasku i zakładkach
      document.getElementById("appBrandTitle").textContent = t.brand;
      document.getElementById("resetAllLabel").textContent = t.resetContract;
      document.getElementById("tabLeftEvidenceLabel").textContent = t.tabEvidence;
      document.getElementById("tabLeftCursedLabel").textContent = t.tabCursed;
      document.getElementById("tabRightListLabel").textContent = t.tabGhostList;
      document.getElementById("tabRightDetailsLabel").textContent = t.tabDetails;

      // Stan przycisków języka
      document.getElementById("btnLangPl").classList.toggle("active", state.lang === "pl");
      document.getElementById("btnLangEn").classList.toggle("active", state.lang === "en");

      // Aktywne zakładki
      document.getElementById("tabLeftEvidence").classList.toggle("active", state.leftTab === "evidence");
      document.getElementById("tabLeftCursed").classList.toggle("active", state.leftTab === "cursed");
      document.getElementById("tabRightList").classList.toggle("active", state.rightTab === "list");
      document.getElementById("tabRightDetails").classList.toggle("active", state.rightTab === "details");

      renderLeftPage();
      renderRightPage();
    }

    // Inicjalizacja po załadowaniu dokumentu
    window.addEventListener("DOMContentLoaded", () => {
      renderAll();
    });
  </script>
</body>
</html>
